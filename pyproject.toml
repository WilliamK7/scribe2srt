[project]
name = "scribe2srt"
version = "0.4.0"
description = "Desktop transcription and subtitle conversion with Windows SendTo integration"
requires-python = ">=3.15,<3.16"
dependencies = [
    "pyside6>=6.12.0",
    "requests>=2.34.2",
    "requests-toolbelt>=1.0.0",
    "opencc-python-reimplemented>=0.1.7",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
    "pefile>=2024.8.26",
    "packaging>=26.3",
]

[tool.uv]
package = false
required-version = "==0.13.0"
default-groups = []
python-preference = "only-managed"
prerelease = "disallow"

name: Build and Release Scribe2SRT

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
    outputs:
      asset_name: ${{ steps.asset.outputs.name }}
    steps:
      - name: Checkout event commit
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install pinned build dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input --progress-bar off -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run offline tests
        run: |
          python -m unittest discover -s tests -t . -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows executable
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --noconsole --name Scribe2SRT --collect-data opencc --additional-hooks-dir scripts/hooks --specpath build/ci --distpath build/ci/dist --workpath build/ci/work app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and validate the extracted ZIP
        id: asset
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactId = $env:GITHUB_SHA.Substring(0, 7)
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $artifactId = $env:GITHUB_REF_NAME }
          python scripts/package_windows.py --executable build/ci/dist/Scribe2SRT.exe --artifact-id $artifactId
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assetName = "Scribe2SRT-$artifactId-windows-x86_64.zip"
          foreach ($file in @("dist/releases/$assetName", "dist/releases/$assetName.sha256")) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing artifact: $file" }
          }
          "name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Upload only this build's ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            dist/releases/${{ steps.asset.outputs.name }}
            dist/releases/${{ steps.asset.outputs.name }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'WilliamK7/scribe2srt'
    permissions:
      contents: write
    steps:
      - name: Download this run's verified Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: artifacts

      - name: Create the tagged release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/${{ needs.build.outputs.asset_name }}
            artifacts/${{ needs.build.outputs.asset_name }}.sha256
          body: |
            Windows x64 便携版。解压到可写目录后运行 Scribe2SRT.exe，无需安装 Python。

            - 增加 Qwen-MT 双语字幕、中文本地繁转简和可恢复的转录/翻译缓存。
            - 增加 Windows“发送到”队列，支持中文和空格路径、多个文件及自动退出。
            - 修正字幕时间轴重叠和 HTTP 压缩声明兼容性。
            - 附带配置示例、第三方组件声明、原始许可证及 ZIP 的 SHA-256 校验文件。

            自动翻译默认开启：外语字幕需配置 Qwen API Key，或先关闭自动翻译；标记为中文的 JSON 可离线繁转简。视频处理建议将 ffmpeg 和 ffprobe 一起加入 PATH，FFmpeg 不随包分发。配置保存在 EXE 旁的 settings.json。

            发布门禁验证离线测试、打包内容、Windows 快捷方式及从 ZIP 解压后的默认中文处理。尚未验证真实 ElevenLabs/Qwen 服务、翻译编号保留率或译文语义质量。

            来源：[cylind/scribe2srt](https://github.com/cylind/scribe2srt)。本次构建源码：[${{ github.sha }}](https://github.com/WilliamK7/scribe2srt/tree/${{ github.sha }})。
